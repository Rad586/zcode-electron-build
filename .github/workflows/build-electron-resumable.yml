name: Build Electron kernel with checkpoints

run-name: Resume Electron ${{ inputs.predecessor || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      predecessor:
        description: Previous run to continue after a workflow update
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      DEPOT_TOOLS_UPDATE: '0'
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
      GCM_GUI_PROMPT: 'false'
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IDLE_TIMEOUT: '0'
      ZCODE_COMPILE_MINUTES: '240'
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Prepare remote workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.longpaths true
          git config --global credential.interactive false
          New-Item -ItemType Directory -Force D:\ec | Out-Null
          git init D:\depot_tools
          if ($LASTEXITCODE) { throw 'depot_tools initialization failed' }
          git -C D:\depot_tools fetch --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git 97da8489e4b7e9dc78fa2efb846871a7b423d933
          if ($LASTEXITCODE) { throw 'depot_tools fetch failed' }
          git -C D:\depot_tools checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'depot_tools checkout failed' }
          'D:\depot_tools' | Add-Content $env:GITHUB_PATH
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          "vs2022_install=$vs" | Add-Content $env:GITHUB_ENV
          $memory = [math]::Ceiling((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)
          "ZCODE_BUILD_MEMORY_GB=$memory" | Add-Content $env:GITHUB_ENV
          "CHECKPOINT_IMAGE=$env:ImageVersion" | Add-Content $env:GITHUB_ENV
          Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfLogicalProcessors,TotalPhysicalMemory
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Used,Free
      - name: Initialize depot_tools
        shell: cmd
        run: |
          call D:\depot_tools\bootstrap\win_tools.bat
          if errorlevel 1 exit /b 1
          if not exist D:\depot_tools\python3_bin_reldir.txt exit /b 1
      - name: Sync Electron and Chromium remotely
        shell: cmd
        working-directory: D:\ec
        run: |
          call D:\depot_tools\gclient.bat config --name src/electron --unmanaged https://github.com/electron/electron
          if errorlevel 1 exit /b 1
          call D:\depot_tools\gclient.bat sync --no-history --shallow --jobs 2 --revision src/electron@v44.10.2
          if errorlevel 1 exit /b 1
      - name: Restore build checkpoint cache
        id: checkpoint
        uses: actions/cache/restore@v4
        with:
          path: D:\ec\checkpoint
          key: ninja-v2-${{ runner.os }}-${{ env.CHECKPOINT_IMAGE }}-44.10.2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ninja-v2-${{ runner.os }}-${{ env.CHECKPOINT_IMAGE }}-44.10.2-
            ninja-v1-${{ runner.os }}-${{ env.CHECKPOINT_IMAGE }}-4dbfd300a0041b5eef4faf03c6674f0192e1ba89-
      - name: Patch kernel and configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git -C D:\ec\src\electron pack-refs --all
          if ($LASTEXITCODE) { throw 'Electron Git reference preparation failed' }
          python "$env:GITHUB_WORKSPACE\apply-frame-cap.py" D:\ec\src\electron
          if ($LASTEXITCODE) { throw 'Native frame cap patch failed' }
          python "$env:GITHUB_WORKSPACE\apply-asar-stat.py" D:\ec\src\electron
          if ($LASTEXITCODE) { throw 'ASAR stat patch failed' }
          if ((Get-PSDrive D).Free -lt 35GB) { throw 'Less than 35 GiB remains for compilation' }
          New-Item -ItemType Directory -Force D:\ec\src\out\Release | Out-Null
          $wrapper = $env:SCCACHE_PATH.Replace('\', '/')
          if (-not $wrapper) { throw 'sccache executable unavailable' }
          @"
          import("//electron/build/args/release.gn")
          target_cpu = "x64"
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          use_remoteexec = false
          use_reclient = false
          cc_wrapper = "$wrapper"
          "@ | Set-Content -Encoding utf8NoBOM D:\ec\src\out\Release\args.gn
          python "$env:GITHUB_WORKSPACE\checkpoint.py" restore
          if ($LASTEXITCODE) { throw 'Build checkpoint restore failed' }
          if (-not (Test-Path D:\ec\src\out\Release\.ninja_log)) {
            Set-Location D:\ec\src
            & D:\depot_tools\gn.bat gen out/Release
            if ($LASTEXITCODE) { throw 'GN generation failed' }
          }
      - name: Compile Windows x64 runtime
        id: compile
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE\compile-runtime.py"
          if ($LASTEXITCODE) { throw 'Compilation incomplete; compiler cache retained for the next run' }
      - name: Prepare build checkpoint
        id: prepare_checkpoint
        if: ${{ !cancelled() && steps.compile.outcome == 'failure' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item D:\ec\checkpoint -Recurse -Force -ErrorAction SilentlyContinue
          python "$env:GITHUB_WORKSPACE\checkpoint.py" save
          if ($LASTEXITCODE) { throw 'Build checkpoint preparation failed' }
      - name: Save build checkpoint cache
        if: ${{ !cancelled() && steps.prepare_checkpoint.outputs.ready == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: D:\ec\checkpoint
          key: ${{ steps.checkpoint.outputs.cache-primary-key }}
      - name: Require completed compilation
        if: ${{ !cancelled() && steps.compile.outcome != 'success' }}
        shell: pwsh
        run: throw 'Compilation incomplete; build checkpoint and compiler cache retained for continuation'
      - name: Report compiler cache
        if: always()
        shell: pwsh
        run: |
          & $env:SCCACHE_PATH --show-stats
      - name: Validate native kernel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:ZCODE_KERNEL_PROFILE = 'D:\ec\test-profile'
          $env:ZCODE_KERNEL_OUTPUT = 'D:\ec\native-kernel.json'
          & D:\ec\src\out\Release\electron.exe "$env:GITHUB_WORKSPACE\native-kernel.cjs"
          if ($LASTEXITCODE) { throw 'Native kernel checks failed' }
          Copy-Item D:\ec\src\electron\lib\node\asar-fs-wrapper.ts D:\ec\asar-fs-wrapper.ts
          Copy-Item D:\ec\src\electron\spec\fixtures\test.asar\a.asar D:\ec\fixture.asar
          $env:ELECTRON_RUN_AS_NODE = '1'
          & D:\ec\src\out\Release\electron.exe --expose-internals "$env:GITHUB_WORKSPACE\test-asar-stat.cjs" D:\ec\asar-fs-wrapper.ts D:\ec\fixture.asar D:\ec\asar-stat.json
          if ($LASTEXITCODE) { throw 'ASAR stat checks failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          @{source = $env:GITHUB_SHA; electron = '44.10.2'; patches = @('frame-cap', 'single-pass-asar-stat')} | ConvertTo-Json | Set-Content -Encoding utf8NoBOM D:\ec\build-inputs.json
      - uses: actions/upload-artifact@v4
        with:
          name: electron-44.10.2-frame-cap-win32-x64
          path: |
            D:\ec\src\out\Release\dist.zip
            D:\ec\build-inputs.json
            D:\ec\native-kernel.json
            D:\ec\asar-stat.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-build-diagnostics
          path: |
            D:\ec\compile.log
            D:\ec\src\out\Release\args.gn
            D:\ec\src\out\Release\.ninja_log
          if-no-files-found: ignore
          retention-days: 7
      - name: Report remaining disk
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name,Used,Free
